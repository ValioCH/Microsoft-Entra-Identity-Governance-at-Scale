<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise Identity Governance at Scale — Planned Architecture</title>
  <desc id="desc">Planned architecture from authoritative sources through lifecycle, Microsoft Entra ID, governance and access control, with enterprise delivery controls.</desc>
